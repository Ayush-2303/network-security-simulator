spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/network_security_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.error.include-message=never
# Set APP_API_KEY in any deployed environment to require this value in the X-API-Key
# header for POST, PUT and DELETE requests. Leave blank only for local demos.
app.api-key=${APP_API_KEY:}
